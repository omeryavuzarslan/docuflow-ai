[project]
name = "docuflow-ai"
version = "0.1.0"
description = "Document intelligence + RAG for invoices, purchase orders and delivery notes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "docling>=2.145.0",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.33",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle
    "F",      # pyflakes
    "I",      # import sorting
    "B",      # bugbear: likely bugs
    "UP",     # pyupgrade: modern syntax
    "N",      # naming conventions
    "SIM",    # simplifications
    "RUF",    # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type hints shipped; used only in parse.py and scan.py.
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# docling_core re-exports its public types from `docling_core.types.doc` without __all__.
module = ["docling_core.*"]
implicit_reexport = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["backend/tests", "data_generator/tests", "eval/tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not slow and not live'"
markers = [
    "slow: runs the Docling models (model load + OCR); run with `uv run pytest -m slow`",
    "live: calls the paid Claude API; run with `uv run --env-file .env pytest -m live`",
]
