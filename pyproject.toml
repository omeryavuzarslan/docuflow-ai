[project]
name = "docuflow-ai"
version = "0.1.0"
description = "Document intelligence + RAG for invoices, purchase orders and delivery notes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.14.2",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle
    "F",      # pyflakes
    "I",      # import sorting
    "B",      # bugbear: likely bugs
    "UP",     # pyupgrade: modern syntax
    "N",      # naming conventions
    "SIM",    # simplifications
    "RUF",    # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["backend/tests", "data_generator/tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
