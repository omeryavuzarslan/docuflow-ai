# Local development services. `docker compose up -d db` starts Postgres with pgvector.
services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: docuflow
      POSTGRES_PASSWORD: docuflow  # local development only
      POSTGRES_DB: docuflow
    ports:
      - "5433:5432"  # 5433 on the host, so it never clashes with another local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuflow -d docuflow"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
